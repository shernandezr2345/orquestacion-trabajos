[project]
name = "orquestacion-trabajos"
version = "0.1.0"
description = "Servicio de Orquestación de Trabajos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "psycopg[binary]>=3.2.1,<4.0.0",
  "pulsar-client[avro]==3.13.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.2,<9.0.0",
  "httpx>=0.27.0,<0.29.0",
  "ruff>=0.6.7,<1.0.0",
  "mypy>=1.11.2,<2.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "config", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "config", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pulsar", "pulsar.schema"]
ignore_missing_imports = true
